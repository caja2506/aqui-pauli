name: Check published Meta Pixel responses
on:
  push:
    branches: [ops/meta-pixel-review]
    paths: [.github/workflows/check-live-pixel.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify the deployed revision and Meta responses in a clean browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pixel-live" --no-package-lock playwright-core@1.56.1
          cat > "$RUNNER_TEMP/pixel-live/live.cjs" <<'NODE'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,headless:false,args:['--no-sandbox']});
            try {
              for(const host of ['aquipauli.com','aqui-pauli.web.app']) {
                const origin='https://'+host;
                const version=await (await fetch(origin+'/deployment.json?check=f7ed7164ca26d31fdbf4b8dc37fd6df05108605d')).json();
                assert.equal(version.commit,'f7ed7164ca26d31fdbf4b8dc37fd6df05108605d');
                const ctx=await browser.newContext(),page=await ctx.newPage(), hits=[];
                page.on('response',async response=>{
                  const url=new URL(response.url());
                  if(!(url.hostname==='www.facebook.com'&&url.pathname.replace(/\/$/,'')==='/tr'))return;
                  const fields=new URLSearchParams(url.search);
                  for(const [k,v] of new URLSearchParams(response.request().postData()||''))fields.set(k,v);
                  if(fields.get('id')!=='1636839314476198')return;
                  hits.push({event:fields.get('ev'),status:response.status(),path:new URL(fields.get('dl')).pathname,ids:fields.get('cd[content_ids]')});
                });
                async function received(event,path){
                  for(let n=0;n<150;n++){
                    const hit=hits.find(h=>h.event===event&&h.path===path&&h.status>=200&&h.status<300);
                    if(hit){console.log('LIVE',host,hit.event,hit.path,hit.status,hit.ids||'');return hit;}
                    await new Promise(r=>setTimeout(r,150));
                  }
                  throw Error('No successful response for '+host+' '+event+' '+path+'; observed '+JSON.stringify(hits));
                }
                await page.goto(origin+'/'); await received('PageView','/');
                const path='/producto/decant-invictus-edt';
                await page.locator('a[href="'+path+'"]').first().click();
                await received('PageView',path);const view=await received('ViewContent',path);
                assert.deepEqual(JSON.parse(view.ids),['DECANT-INVICTUS-EDT-2ML']);
                await ctx.close();
              }
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
          CHROME_BIN="$(command -v google-chrome)" xvfb-run -a node "$RUNNER_TEMP/pixel-live/live.cjs"
