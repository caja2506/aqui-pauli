name: Load and verify the six approved decants
on:
  push:
    branches: [ops/seis-decants-noviembre]
    paths: ['.github/workflows/approved-six-decants.yml']
permissions:
  contents: read
concurrency:
  group: approved-six-decants
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8811a47290e58db2d496852cb41d19811b2aa763
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --prefix functions
      - name: Check dry run, images, approved prices and free IDs
        working-directory: functions
        run: |
          node --test test/decant-products.test.js
          node scripts/seed-six-decants.js --dry-run > "$RUNNER_TEMP/six-decants-plan.json"
          node <<'JS'
          const assert = require('node:assert/strict');
          const { readFileSync } = require('node:fs');
          const { newProducts } = require('./scripts/seed-six-decants');
          const products = [["clinique-happy-men","Clinique Happy for Men",[1700,2300,3300]],["light-blue-mujer","Dolce & Gabbana Light Blue mujer",[2500,3200,4500]],["bad-boy-edt","Carolina Herrera Bad Boy EDT",[2900,4100,6300]],["halloween-blue-drop","Jesús del Pozo Halloween Blue Drop",[1700,2300,3200]],["club-de-nuit-intense-man","Armaf Club de Nuit Intense Man",[2500,3000,4000]],["invictus-edt","Paco Rabanne Invictus EDT",[2800,3500,5300]]];
          const category = 'categories/decants';
          const root = 'https://firestore.googleapis.com/v1/projects/aqui-pauli/databases/(default)/documents/';
          async function get(path) {
            const r=await fetch(root+path,{signal:AbortSignal.timeout(20000)});
            if (r.status===404) return null;
            assert.equal(r.status,200,path);
            return (await r.json()).fields;
          }
          const plan = newProducts(category, 'preview');
          async function inspect() {
            assert.equal(plan.length,24);
            const paths=plan.map(([p])=>p);assert.equal(new Set(paths).size,24);
            for (const [slug,name,prices] of products) {
              const p='products/decant-'+slug;
              const data=plan.find(([path])=>path===p)[1];
              assert.equal(data.name,name+' · Decant');
              assert.equal(data.slug,'decant-'+slug);
              const url='https://aquipauli.com/img/decants/'+slug+'.jpg';
              assert.deepEqual(data.images,[url]);assert.deepEqual(data.categoryRefs,[category]);
              const photo=await fetch(url,{signal:AbortSignal.timeout(20000)});
              assert.equal(photo.status,200,url);assert.match(photo.headers.get('content-type')||'',/^image\//);
              assert.ok((await photo.arrayBuffer()).byteLength>100,url);
              for (const [i,size] of [2,3,5].entries()) {
                const v=plan.find(([path])=>path===p+'/variants/'+size+'ml')[1];
                assert.deepEqual([v.name,v.price,v.stock,v.reservedStock,v.active,v.supplyType,v.commercialStatus],
                  [size+' ml',prices[i],1,0,true,'stock_propio','disponible']);
              }
              console.log('IMAGE OK '+url);
            }
            assert.equal((await get(category))?.active?.booleanValue,true,'category must be active');
            const present=await Promise.all(paths.map(get));
            const collisions=paths.filter((p,i)=>present[i]); console.log('PRECHECK '+collisions.length+'/24 already exist');
            if(collisions.length) throw Error('Identifiers already in use: '+collisions.join(', '));
          }
          inspect().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
      - name: Create approved catalog documents in production
        working-directory: functions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AQUI_PAULI }}
        run: |
          set -eu
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/approved-six-decants.json"
          trap 'rm -f -- "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          unset FIREBASE_SERVICE_ACCOUNT
          node -e 'const fs=require("fs");const account=JSON.parse(fs.readFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS)); if(account.project_id!=="aqui-pauli"||account.type!=="service_account") process.exit(1)'
          node scripts/seed-six-decants.js --commit
      - name: Install browser verifier
        run: npm install --prefix "$RUNNER_TEMP/six-decants-qa" playwright-core@1.56.1 --no-audit --no-fund
      - name: Read back all prices and stock and open each product on the live store
        working-directory: ${{ runner.temp }}/six-decants-qa
        run: |
          node <<'JS'
          const assert=require('node:assert/strict');
          const {chromium}=require('playwright-core');
          const {execFileSync}=require('node:child_process');
          const products=[["clinique-happy-men","Clinique Happy for Men",[1700,2300,3300]],["light-blue-mujer","Dolce & Gabbana Light Blue mujer",[2500,3200,4500]],["bad-boy-edt","Carolina Herrera Bad Boy EDT",[2900,4100,6300]],["halloween-blue-drop","Jesús del Pozo Halloween Blue Drop",[1700,2300,3200]],["club-de-nuit-intense-man","Armaf Club de Nuit Intense Man",[2500,3000,4000]],["invictus-edt","Paco Rabanne Invictus EDT",[2800,3500,5300]]];
          const base='projects/aqui-pauli/databases/(default)/documents/';
          async function fields(p) {
            const r=await fetch('https://firestore.googleapis.com/v1/'+base+p,{signal:AbortSignal.timeout(20000)});
            assert.equal(r.status,200,p);return (await r.json()).fields;
          }
          async function verify(){
            const browser=await chromium.launch({executablePath:execFileSync('which',['google-chrome'],{encoding:'utf8'}).trim(),args:['--no-sandbox']});
            try {
              const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
              for(const [slug,name,prices] of products){
                const id='decant-'+slug,path='products/'+id,photo='https://aquipauli.com/img/decants/'+slug+'.jpg';
                const product=await fields(path);
                assert.equal(product.active.booleanValue,true);assert.equal(product.deleted.booleanValue,false);assert.equal(product.productKind.stringValue,'decant');
                assert.equal(product.slug.stringValue,id);assert.equal(product.name.stringValue,name+' · Decant');
                assert.equal(product.categoryRefs.arrayValue.values[0].referenceValue,base+'categories/decants');
                assert.equal(product.images.arrayValue.values[0].stringValue,photo);
                assert.equal(Number(product.basePrice.integerValue),prices[0]);
                const url='https://aquipauli.com/producto/'+id;
                const response=await page.goto(url,{waitUntil:'domcontentloaded'});assert.equal(response.status(),200,url);
                await page.getByRole('heading',{level:1,name:name+' · Decant',exact:true}).waitFor();
                await page.waitForFunction(src=>[...document.images].some(i=>i.currentSrc===src && i.complete && i.naturalWidth>0),photo);
                for(const [i,size] of [2,3,5].entries()){
                  const v=await fields(path+'/variants/'+size+'ml');
                  assert.deepEqual([v.name.stringValue,Number(v.price.integerValue),Number(v.stock.integerValue),Number(v.reservedStock.integerValue),v.active.booleanValue,v.supplyType.stringValue,v.commercialStatus.stringValue],[size+' ml',prices[i],1,0,true,'stock_propio','disponible']);
                  await page.getByRole('button',{name:size+' ml',exact:true}).click();
                  const shown=await page.locator('[data-testid="product-mobile-price"]').innerText();
                  assert.equal(Number(shown.replace(/[^0-9]/g,'')),prices[i],id+' '+size+' ml');
                }
                console.log('VERIFIED '+id+' sizes=2/3/5 prices='+prices.join('/')+' stock=1/1/1 reserved=0/0/0 active=true image=decoded '+url);
              }
            }finally{await browser.close();}
          }
          verify().catch(e=>{console.error(e);process.exitCode=1});
          JS
