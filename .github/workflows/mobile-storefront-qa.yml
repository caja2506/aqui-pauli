name: Verify mobile home, checkout bar and navigation in Chrome
on:
  push:
    branches: [ops/mobile-storefront-qa]
    paths: ['.github/workflows/mobile-storefront-qa.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 497e446ed069e47f65bc549095ce5c151b7a6399
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run build
      - run: npm install --prefix "$RUNNER_TEMP/mobile-qa" playwright-core@1.56.1 --no-audit --no-fund
      - name: Exercise real product data without submitting orders
        env:
          TEST_SITE: http://127.0.0.1:4173
        run: |
          set -eu
          npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/mobile-preview.log 2>&1 &
          preview=$!
          trap 'kill "$preview" || true' EXIT
          for try in $(seq 1 30); do if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi; sleep 1; done
          cd "$RUNNER_TEMP/mobile-qa"
          node <<'JS'
          const {chromium}=require('playwright-core');
          const {execFileSync}=require('node:child_process');
          const assert=require('node:assert/strict');
          const live='https://aquipauli.com', site=process.env.TEST_SITE;
          const id='decant-stronger-with-you-intensely', moschino='decant-moschino-toy-2-pearl';
          const card=(page,id)=>page.locator('a[href="/producto/'+id+'"]').first();
          const box = async target=>{await target.waitFor({state:'visible'});return target.boundingBox()};
          const readyImg=async (page,id)=>{await page.waitForFunction(id=>{const el=document.querySelector('a[href="/producto/'+id+'"] img');return el?.complete && el.naturalWidth>0},id);};
          const textOf=async loc=>(await loc.innerText()).replace(/\s+/g,' ').trim();
          const metrics=async(page,url)=>{
            await page.goto(url,{waitUntil:'domcontentloaded'});
            await readyImg(page,id); await readyImg(page,moschino); await card(page,id).getByRole('button',{name:'Ver opciones'}).waitFor();
            await page.locator('[data-testid="giveaway-banner"]').waitFor({timeout:3500}).catch(()=>{});
            const nodes=[page.locator('h1'),page.locator('#home-product-search'),page.getByRole('heading',{name:'Productos Destacados'}),card(page,id)];
            return Promise.all(nodes.map(box));
          };
          (async()=>{
            const browser=await chromium.launch({executablePath:execFileSync('which',['google-chrome'],{encoding:'utf8'}).trim(),args:['--no-sandbox']});
            try {
              const desk=await browser.newPage({viewport:{width:1440,height:900}});
              const before=await metrics(desk,live),after=await metrics(desk,site);
              assert.equal(await desk.getByRole('navigation',{name:'Categorías de la tienda'}).isVisible(),false);
              if(site!==live) before.forEach((a,i)=>{for(const key of ['x','y','width','height'])assert.ok(Math.abs(a[key]-after[i][key])<=2,JSON.stringify({desktop:i,key,a,after:after[i]}));});
              console.log('DESKTOP',JSON.stringify({before,after}));
              await desk.close();
              const compact=await browser.newPage({viewport:{width:320,height:568},isMobile:true});
              await metrics(compact,site);
              const first=await box(card(compact,id));
              assert.ok(first.y+Math.min(first.width,145)<568,'products must be visible on 320x568: '+first.y);
              assert.equal(await compact.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false);
              console.log('SMALL',JSON.stringify(first));await compact.close();
              const mobile=await browser.newPage({viewport:{width:390,height:844},isMobile:true});
              const errors=[];mobile.on('pageerror',err=>errors.push(err.message));
              await metrics(mobile,site);const firstMobile=await box(card(mobile,id));
              assert.ok(firstMobile.y+firstMobile.width<844,JSON.stringify(firstMobile));
              assert.equal(await mobile.locator('[data-mobile-cart-link]').count(),0);
              const chips=mobile.getByRole('navigation',{name:'Categorías de la tienda'});
              assert.ok(await chips.evaluate(e=>e.scrollWidth>e.clientWidth));console.log('MOBILE',JSON.stringify({first:firstMobile,chips:await chips.getByRole('link').allTextContents()}));
              await chips.getByRole('link',{name:'Perfumes hombre',exact:true}).click();await mobile.waitForURL('**/catalogo?categoria=LTD4HApgXSUBRmJt0ZVo');
              await mobile.locator('a[href^="/producto/"]').first().waitFor();
              assert.equal(await card(mobile,id).count(),0);
              await mobile.reload({waitUntil:'domcontentloaded'});await mobile.locator('a[href^="/producto/"]').first().waitFor();
              assert.equal(await card(mobile,id).count(),0);
              await mobile.goto(site);await readyImg(mobile,id);
              await mobile.evaluate(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'instant'}));
              await card(mobile,moschino).click();await mobile.waitForURL('**/producto/'+moschino);
              await mobile.getByRole('heading',{name:/Moschino Toy 2 Pearl/}).waitFor();
              assert.equal(await mobile.evaluate(()=>scrollY),0);
              await mobile.getByRole('button',{name:'2 ml',exact:true}).click();
              await mobile.getByRole('button',{name:/Agregar al Carrito/i}).click();
              const add=mobile.locator('[data-testid="product-purchase-bar"]'), pay=add.locator('[data-mobile-cart-link]');
              await pay.waitFor();const payText=await textOf(pay);assert.ok(/5\s?300, 1 artículo/.test(payText),payText);
              await mobile.waitForTimeout(2200);const a=await box(add.getByRole('button',{name:/Agregar al Carrito/i})),b=await box(pay);
              assert.ok((a.x+a.width<=b.x+1 || b.x+b.width<=a.x+1 || a.y+a.height<=b.y+1 || b.y+b.height<=a.y+1) && b.y+b.height<=845,JSON.stringify({a,b}));
              console.log('COMBINED',JSON.stringify({payText,a,b,scroll:'top on entry'}));
              await mobile.goto(site+'/catalogo');await mobile.locator('[data-mobile-cart-dock]').waitFor();
              await card(mobile,id).click();await mobile.getByRole('heading',{name:/Stronger With You/}).waitFor();assert.equal(await mobile.evaluate(()=>scrollY),0);
              await mobile.getByRole('button',{name:'5 ml',exact:true}).click();await mobile.getByRole('button',{name:/Agregar al Carrito/i}).click();
              await mobile.waitForFunction(()=>/12\s?600, 2 artículos/.test(document.querySelector('[data-mobile-cart-link]')?.textContent||''));
              await mobile.goto(site+'/terminos');const dock=mobile.locator('[data-mobile-cart-dock]');
              assert.match(await textOf(dock),/12\s?600, 2 artículos/);
              const dockBox=await box(dock);assert.ok(Math.abs(dockBox.y+dockBox.height-844)<2);
              await mobile.getByRole('button',{name:/Abrir carrito/}).click();
              await mobile.getByRole('dialog').waitFor();assert.equal(await dock.count(),0);
              await mobile.getByRole('button',{name:/Cerrar carrito/}).click();await dock.waitFor();
              await mobile.route('**/accounts:signUp*',r=>r.abort());
              await dock.getByRole('link').click();await mobile.waitForURL('**/checkout');
              console.log('CHECKOUT',mobile.url(),'two items include 2500 shipping; no order submitted');
              await mobile.goto(site+'/');await readyImg(mobile,id);
              await mobile.route('**/img/decants/stronger-with-you-intensely.jpg',r=>r.abort());
              await mobile.reload();await mobile.waitForFunction(id=>{const img=document.querySelector('a[href="/producto/'+id+'"] img');return img?.naturalWidth>0 && img.src.includes('?v=1')},id);
              console.log('FALLBACK',await card(mobile,id).locator('img').getAttribute('src'));
              assert.deepEqual(errors,[]);await mobile.close();
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
