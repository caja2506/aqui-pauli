name: First deployment of the PR 29 discount release trigger
on:
  push:
    branches: [ops/pr29-release-discount-trigger]
    paths: ['.github/workflows/pr29-first-discount-trigger.yml']
permissions:
  contents: read
concurrency:
  group: firebase-functions-aqui-pauli
  cancel-in-progress: false
jobs:
  deploy_trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the reviewed main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fa34bee08dedcd864f52c978d8d9d11777c4158f
          persist-credentials: false
      - name: Set up Node for Functions
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install pinned deployment tools and application dependencies
        run: |
          npm ci --prefix functions
          npm install --global firebase-tools@15.34.2
      - name: Verify Functions before deploying
        run: npm --prefix functions test
      - name: Accept retries only for the new releaseOrderDiscount trigger
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AQUI_PAULI }}
        run: |
          set -eu
          umask 077
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/pr29-deploy.json"
          trap 'rm -f -- "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          python - <<'PY'
          import json, os
          account = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])
          if account.get('type') != 'service_account' or account.get('project_id') != 'aqui-pauli':
              raise SystemExit('Unexpected Firebase project credentials')
          with open(os.environ['GOOGLE_APPLICATION_CREDENTIALS'], 'x') as f:
              json.dump(account, f)
          PY
          unset FIREBASE_SERVICE_ACCOUNT
          firebase deploy --project aqui-pauli --non-interactive --force --only functions:default:releaseOrderDiscount
