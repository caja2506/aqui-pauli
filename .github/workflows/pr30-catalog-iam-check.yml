name: Identify the Firestore seed principal and its effective project permissions
on:
  push:
    branches: [ops/pr30-catalog-bootstrap]
    paths: ['.github/workflows/pr30-catalog-iam-check.yml']
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report only the active principal and creation permission
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AQUI_PAULI }}
        run: |
          set -eu
          umask 077
          export CLOUDSDK_CONFIG="$RUNNER_TEMP/pr30-gcloud"
          SA_FILE="$RUNNER_TEMP/pr30-iam.json"
          trap 'rm -rf -- "$SA_FILE" "$CLOUDSDK_CONFIG"' EXIT
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          unset FIREBASE_SERVICE_ACCOUNT
          gcloud auth activate-service-account --key-file="$SA_FILE" --project=aqui-pauli --quiet
          gcloud auth list --filter=status:ACTIVE --format='value(account)'
          python - <<'PY'
          import json, subprocess, urllib.request
          token = subprocess.check_output(['gcloud','auth','print-access-token','--quiet'],text=True).strip()
          requested = ['datastore.entities.get','datastore.entities.create']
          req = urllib.request.Request('https://cloudresourcemanager.googleapis.com/v1/projects/aqui-pauli:testIamPermissions', data=json.dumps({'permissions':requested}).encode(), headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}, method='POST')
          with urllib.request.urlopen(req,timeout=20) as response:
              granted = json.load(response).get('permissions',[])
          for name in requested:
              print(name, 'GRANTED' if name in granted else 'NOT GRANTED at project')
          PY
