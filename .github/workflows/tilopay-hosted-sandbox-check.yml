name: Verify hosted form in test and restore scheduler
on:
  push:
    branches: [chatgpt/tilopay-hosted-sandbox-check]
permissions:
  contents: read
concurrency:
  group: firebase-functions-aqui-pauli
  cancel-in-progress: false
jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --prefix functions && npm install --global firebase-tools@15.34.2
      - run: node --check functions/lib/sandboxHostedCheck.js && npm --prefix functions test > "$RUNNER_TEMP/check-tests.log"
      - name: Prepare deployment identity
        env:
          BOUND_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AQUI_PAULI }}
        run: |
          node -e 'const fs=require("node:fs"); const s=JSON.parse(process.env.BOUND_ACCOUNT); if(s.project_id!=="aqui-pauli") throw Error("wrong project"); fs.writeFileSync(process.env.RUNNER_TEMP+"/bound-firebase.json",JSON.stringify(s),{mode:0o600,flag:"wx"});'
      - id: probe
        name: Deploy sandbox check only on existing private scheduled runtime
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bound-firebase.json
        run: firebase deploy --project aqui-pauli --only functions:default:tilopayReconcilePayments --non-interactive
      - name: Inspect private sandbox outcome
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bound-firebase.json
        run: node functions/read-sandbox-result.cjs
      - name: Restore main source
        if: always() && steps.probe.outcome != 'skipped'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
          path: restore
      - name: Restore normal scheduled function
        if: always() && steps.probe.outcome != 'skipped'
        working-directory: restore
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/bound-firebase.json
        run: npm ci --prefix functions && firebase deploy --project aqui-pauli --only functions:default:tilopayReconcilePayments --non-interactive
      - if: always()
        run: rm -f -- "$RUNNER_TEMP/bound-firebase.json"
