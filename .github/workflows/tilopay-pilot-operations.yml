name: Coordinate private Tilopay pilot
on:
  push:
    branches: [chatgpt/tilopay-pilot-operations]
permissions:
  contents: read
concurrency:
  group: private-tilopay-pilot-operations
  cancel-in-progress: false
jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - name: Verify or coordinate the scoped pilot
        env:
          PILOT_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AQUI_PAULI }}
        run: node functions/pilot-ops.cjs
