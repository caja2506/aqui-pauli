name: Secure catalog stock and prices

on:
  push:
    branches: [main]
    paths:
      - 'functions/scripts/secure-catalog.js'
      - '.github/workflows/catalog-safety.yml'

permissions:
  contents: read

concurrency:
  group: catalog-safety-aqui-pauli
  cancel-in-progress: false

jobs:
  secure_catalog:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions
      - name: Verify safety and transaction tests before loading credentials
        run: npm --prefix functions test
      - name: Prepare Firebase application default credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AQUI_PAULI }}
        run: |
          node --input-type=module <<'NODE'
          import { chmodSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';

          const fail = (message) => {
            console.error(`::error::${message}`);
            process.exit(1);
          };
          const credential = process.env.FIREBASE_SERVICE_ACCOUNT;
          if (!credential) {
            fail('Missing repository secret FIREBASE_SERVICE_ACCOUNT_AQUI_PAULI. See docs/firebase-functions-deploy.md. Nothing has been deployed.');
          }
          let account;
          try {
            account = JSON.parse(credential);
          } catch {
            fail('The Firebase secret must contain the complete service account JSON.');
          }
          if (account?.type !== 'service_account' || account.project_id !== 'aqui-pauli'
              || typeof account.client_email !== 'string' || !account.client_email.trim()
              || typeof account.private_key !== 'string' || !account.private_key.trim()) {
            fail('The Firebase secret must be a service account for project aqui-pauli.');
          }
          if (!process.env.RUNNER_TEMP) fail('The runner temporary directory is unavailable.');
          const path = join(process.env.RUNNER_TEMP, 'firebase-aqui-pauli-functions-service-account.json');
          writeFileSync(path, JSON.stringify(account), { mode: 0o600, flag: 'wx' });
          chmodSync(path, 0o600);
          NODE

      - name: Audit current catalog
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-aqui-pauli-functions-service-account.json
        run: node functions/scripts/secure-catalog.js --project aqui-pauli --dry-run
      - name: Apply authorized stock cap and disable unsafe test products
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-aqui-pauli-functions-service-account.json
        run: node functions/scripts/secure-catalog.js --project aqui-pauli --apply
      - name: Verify catalog after changes
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-aqui-pauli-functions-service-account.json
        run: node functions/scripts/secure-catalog.js --project aqui-pauli --verify
      - name: Remove deployment credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/firebase-aqui-pauli-functions-service-account.json"
